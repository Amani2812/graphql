<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphQL Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>My GraphQL Profile</h1>
        
        <!-- Section 1: Basic User Info -->
        <div class="section">
            <h2>👤 User Information</h2>
            <div id="user-info">
                <p>Loading user data...</p>
            </div>
        </div>

        <!-- Section 2: XP and Level -->
        <div class="section">
            <h2>⭐ Experience & Level</h2>
            <div id="xp-info">
                <p>Loading XP data...</p>
            </div>
        </div>

        <!-- Section 3: Projects and Audits -->
        <div class="section">
            <h2>📚 Projects & Audits</h2>
            <div id="projects-info">
                <p>Loading project data...</p>
            </div>
        </div>

        <!-- Section 4: Statistics (Mandatory) -->
        <div class="section">
            <h2>📊 My Statistics</h2>
            <div class="charts">
                <div class="chart-container">
                    <h3>XP Progress Over Time</h3>
                    <svg id="xp-chart" width="400" height="300"></svg>
                </div>
                <div class="chart-container">
                    <h3>Project Success Rate</h3>
                    <svg id="success-chart" width="300" height="300"></svg>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
